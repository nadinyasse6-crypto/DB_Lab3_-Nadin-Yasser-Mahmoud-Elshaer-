<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Edit Author</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">
<div class="container mt-5" style="max-width: 500px;">
    <h3 class="mb-4">Edit Author</h3>
    <form method="POST" class="card p-4 shadow-sm">
        <div class="mb-3">
            <label>Author Name</label>
            <input type="text" name="name" value="{{ author.name }}" class="form-control" required>
        </div>
        <div class="mb-3">
            <label>Country</label>
            <input type="text" name="country" value="{{ author.country }}" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100 mb-2">Update Author</button>
        <a href="/library" class="btn btn-secondary w-100">Cancel</a>
    </form>
</div>
</body>
</html>
